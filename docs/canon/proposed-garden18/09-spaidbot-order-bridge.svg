<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><linearGradient id="b" x2="0" y2="1"><stop stop-color="#161a1f"/><stop offset="1" stop-color="#080a0c"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#775b36"/><stop offset=".5" stop-color="#e5c881"/><stop offset="1" stop-color="#775b36"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#b)"/><path d="M0 100H1600" stroke="url(#g)" stroke-width="2"/><text x="52" y="42" fill="#d9b56d" font-family="Arial" font-size="14" letter-spacing="3">ABOVE THE HILL / WM PRO</text><text x="52" y="76" fill="#f1eadc" font-family="Arial" font-size="31" font-weight="700">SpaidBot can help prepare. The trader owns the send.</text><text x="1540" y="43" text-anchor="end" fill="#d4b36c" font-family="Arial" font-size="13" letter-spacing="2">GARDEN 18 · PROPOSED EXECUTION BOUNDARY</text><text x="52" y="140" fill="#aaa79e" font-family="Arial" font-size="15">Current live UI says analysis-only and cannot access accounts or place orders. Preserve that truth until a separately authorized capability exists.</text>
<rect x="52" y="174" width="1496" height="714" rx="24" fill="#0c1014" stroke="#423a2e"/><rect x="82" y="208" width="430" height="618" rx="19" fill="#14191e" stroke="#66563a"/><text x="112" y="252" fill="#e5c781" font-family="Arial" font-size="21" font-weight="700">SPAIDBOT · ANALYSIS MODE</text><text x="112" y="283" fill="#899195" font-family="Arial" font-size="13">Reads the same market objects as the chart.</text><rect x="108" y="316" width="378" height="138" rx="14" fill="#0d1317" stroke="#36403e"/><text x="132" y="352" fill="#9ac3aa" font-family="Arial" font-size="13" font-weight="700">EVIDENCE SUMMARY</text><text x="132" y="386" fill="#e2ddd1" font-family="Arial" font-size="15">NQ is inside value; call-wall data is partial.</text><text x="132" y="416" fill="#aaa79e" font-family="Arial" font-size="13">Quotes live · options source 12m old · no tape</text><rect x="108" y="474" width="378" height="138" rx="14" fill="#0d1317" stroke="#36403e"/><text x="132" y="510" fill="#d9b66e" font-family="Arial" font-size="13" font-weight="700">CANDIDATE THESIS</text><text x="132" y="544" fill="#e2ddd1" font-family="Arial" font-size="15">Wait for acceptance above 18,452.</text><text x="132" y="574" fill="#aaa79e" font-family="Arial" font-size="13">Invalidation must be chosen by the trader.</text><rect x="108" y="632" width="378" height="88" rx="14" fill="#171812" stroke="#6b5934"/><text x="132" y="668" fill="#dcc27f" font-family="Arial" font-size="14" font-weight="700">NO ACCOUNT ACCESS</text><text x="132" y="697" fill="#b7b2a6" font-family="Arial" font-size="13">No silent order · no broker token in chat</text><text x="112" y="777" fill="#858c8e" font-family="Arial" font-size="12">Evidence citations open Inspect on the same Decision_ID.</text>
