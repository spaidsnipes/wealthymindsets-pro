<rect x="640" y="208" width="420" height="618" rx="19" fill="#14191e" stroke="#60523b"/><text x="670" y="252" fill="#e4c780" font-family="Arial" font-size="21" font-weight="700">ORDER PREFLIGHT</text><text x="670" y="283" fill="#899195" font-family="Arial" font-size="13">Separate ticket · current provider truth</text><g font-family="Arial"><text x="670" y="337" fill="#8c9494" font-size="12">INSTRUMENT / CONTRACT</text><text x="670" y="363" fill="#e2ddd1" font-size="16">/NQZ6 · Futures · $20 / point</text><text x="670" y="412" fill="#8c9494" font-size="12">BROKER / ACCOUNT</text><text x="670" y="438" fill="#e2ddd1" font-size="16">tastytrade · •••• 5019</text><text x="670" y="487" fill="#8c9494" font-size="12">ORDER / MAX LOSS</text><text x="670" y="513" fill="#e2ddd1" font-size="16">Buy 1 · Limit · risk not set</text><text x="670" y="562" fill="#8c9494" font-size="12">PROTECTION</text><text x="670" y="588" fill="#dc9d82" font-size="15">No bracket/OCO · stop separately</text></g><rect x="666" y="632" width="368" height="80" rx="13" fill="#201b15" stroke="#81653e"/><text x="850" y="665" text-anchor="middle" fill="#e3cd9b" font-family="Arial" font-size="14" font-weight="700">BLOCKED · SET RISK + PROTECTION</text><text x="850" y="691" text-anchor="middle" fill="#aa9e86" font-family="Arial" font-size="12">Preview never sends the order</text><text x="670" y="777" fill="#858c8e" font-family="Arial" font-size="12">All risk ceilings and market freshness are rechecked server-side.</text>
