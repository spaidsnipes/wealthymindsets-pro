# The Sentinels get a MACHINE.
#
# ── The measured failure ──────────────────────────────────────────────────────
#
# On 2026-09-11 this repository contained 498 test files and 5,585 tests,
# including every Sentinel written to enforce the Garden Pass gates: provider
# rights review, single-owner vocabularies, front-door authority, canonical
# store ownership. `ls -a` showed NO `.github` directory. No workflows, no
# hooks, no rulesets. Not one of those 5,585 assertions ran anywhere except on
# a human's laptop, when that human remembered to type `vitest`.
#
# The Garden Pass already named this: branch and doc discipline were documented
# PROCESS with no MACHINE behind it. What it had not yet named is the harder
# version — the Sentinels THEMSELVES were PARTIAL_FRUIT. A guard that only runs
# when someone chooses to run it does not guard; it documents an intention. The
# first tired push at 2am is the one it was written for, and the one it misses.
#
# Every Sentinel this repo has ever written was, until this file existed,
# a claim about enforcement rather than enforcement.
#
# ── Why nothing could see it ──────────────────────────────────────────────────
#
# Absence has no file to typecheck. A missing workflow produces no error, no
# warning, and no red mark anywhere — the suite is green precisely BECAUSE
# nothing ran. That is the purest form of the accidentally-correct silence this
# codebase keeps finding: nothing objected, so it read as approval.
#
# ── What this runs, and what it honestly cannot ───────────────────────────────
#
# PROVEN before this file was committed, from a clean git worktree containing
# NO `.env.local` and no secrets of any kind — the same condition CI runs in:
#
#   tsc --noEmit --skipLibCheck  -> exit 0
#   vitest run                   -> 498 files / 5,585 tests passed
#   next build                   -> exit 0
#
# So this workflow is not aspirational. It is a recording of three commands
# already observed to pass under CI conditions.
#
# WHAT THIS DOES NOT DO, stated plainly so no one mistakes a green check for
# more than it is:
#   · It does not deploy. Production is Cloudflare/OpenNext via `deploy:cf`,
#     still a human-run command. A green check here means the code is sound,
#     NOT that it is live. Runtime proof remains a chain, not a noun.
#   · It does not enforce. GitHub reports zero rulesets on this repo, so a
#     failing run does not BLOCK a merge until a human turns on branch
#     protection and marks these checks required. Until then this is a loud
#     alarm, not a locked door. That step is founder-only and is recorded in
#     the handoff rather than silently assumed.
#   · It does not verify any browser scene, any broker wiring, or any live
#     market data. Those need credentials and a real session.

name: Sentinels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push should cancel the first run rather than burn minutes proving
# something about a commit nobody is waiting on any more.
concurrency:
  group: sentinels-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sentinels:
    name: typecheck · sentinels · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version these three commands were observed to pass on
          # locally (v24.16.0). The repo declares no `engines` and has no
          # `.nvmrc`; pinning the major here is the honest minimum, and this
          # comment is the pointer for whoever adds a real version owner.
          node-version: '24'
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      # Ordered cheapest-first so a type error reports in a minute instead of
      # waiting behind a full build.
      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit --skipLibCheck

      - name: Sentinels
        run: ./node_modules/.bin/vitest run

      - name: Production build
        run: ./node_modules/.bin/next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # ── Phone geometry ────────────────────────────────────────────────────
      #
      # The three steps above read SOURCE. Not one of them can see a rendered
      # pixel, and twice now this repo has shipped a defect that only geometry
      # could name: a dismiss button centred 100% off a 375px viewport, and
      # sixteen watchlist rows whose tickers were laid out at zero width. Both
      # were green in every source Sentinel, because the markup was correct and
      # the LAYOUT was not.
      #
      # This step serves the artifact the previous step just built and measures
      # it. Building and then discarding the build was leaving the only thing
      # that can answer the question on the floor.
      #
      # PROVEN before this was committed, under exactly these conditions — a
      # clean git worktree with NO `.env.local` and no secrets of any kind:
      #   next build   -> exit 0
      #   next start   -> /login answered 200
      #   audit:phone  -> 3 routes, offenders=0 evicted-text=0, exit 0
      #
      # SCOPE, stated so a green check is not over-read: this measures the three
      # routes reachable WITHOUT a session. Every interior route client-side
      # redirects to /login, and the harness now FAILS rather than reporting a
      # login page's geometry under an interior route's name. Auditing /charts
      # needs a seeded test account, which this repo does not yet have.
      - name: Install a browser to measure with
        # `playwright` in devDependencies ships the driver, not a binary. The
        # harness prefers the installed Chrome and falls back to this, naming
        # which engine measured; with neither it refuses and exits 2.
        run: npx playwright install --with-deps chromium

      - name: Phone geometry (375px)
        run: |
          ./node_modules/.bin/next start -p 3488 &
          # Poll rather than sleep a guessed number of seconds, and FAIL if the
          # server never answers. A fixed sleep that is one second short would
          # report a geometry defect that is really a cold start.
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3488/login && break
            if [ "$i" = 60 ]; then echo "server never answered on :3488"; exit 1; fi
            sleep 1
          done
          npm run audit:phone -- --base http://localhost:3488
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # ── Interior surface geometry ─────────────────────────────────────────
      #
      # The step above measures only the three routes reachable WITHOUT a
      # session. Every interior surface — the decision spine, the passport
      # panel, the WHY panel, the decision chain — has been source-gated and
      # geometry-ungated this whole time, which is the exact standing warning
      # recorded when DecisionSpineBand shipped nineteen green tests over five
      # vertical noodles at 390px.
      #
      # measure-experience-geometry.mjs answers that by rendering each surface
      # alone against a real browser at three widths. It existed before this
      # commit and was never wired in, for a mundane reason worth recording:
      # it was permanently RED on a false positive (it measured the CSS source
      # inside an inline <style> child as a 0px-wide crushed phrase), and a
      # gate that cries wolf cannot be enforced. That is fixed in this commit,
      # so the gate can finally hold.
      #
      # SCOPE, stated so a green check is not over-read: surfaces are measured
      # in ISOLATION against fixtures, not in the composed scene. It proves no
      # surface crushes or truncates its own text at 390/834/1440. It does NOT
      # prove the assembled room reads well — that remains HUMAN_PROOF_REQUIRED.
      - name: Interior surface geometry (390 / 834 / 1440px)
        run: node scripts/measure-experience-geometry.mjs 390 834 1440

      # ── Volume Profile PIXELS ─────────────────────────────────────────────
      #
      # Every step above measures TEXT in a DOM. The Volume Profile is painted
      # on a canvas, which has no DOM, and that one sentence is why the "live VP
      # render geometry proof" gate stayed open across several batons: vitest
      # genuinely cannot see it. It was recorded as needing "a different
      # instrument, not another unit test", and then nothing picked one up.
      #
      # A real browser canvas has getImageData(). The instrument was available
      # the whole time. prove-vp-pixels.mjs paints a profile using ONLY the
      # shipped owners in src/lib/vpDrawGeometry.ts and reads the bytes back,
      # turning three prose claims in that module's header — pixel-flush rows,
      # bar length directly proportional to volume, never over the price axis —
      # into measurements.
      #
      # SCOPE, stated so a green check is not over-read: this proves the
      # geometry OWNERS paint an honest picture. It does NOT prove MainChart's
      # composed scene does; drawWMVP also picks colours and draws POC/VAH/VAL
      # over live price action, and that remains HUMAN_PROOF_REQUIRED. What it
      # removes is the larger blind spot underneath: until this commit nothing
      # in this repo had ever observed a single painted profile pixel.
      #
      # Each of the five laws has a matching WM_VP_REVIVE mode that makes it
      # fail on demand, so a law that has quietly stopped measuring can be
      # caught. Three of the five were written wrong the first time and were
      # only found because their revive ran GREEN.
      - name: Volume Profile pixel proof
        run: npm run prove:vp-pixels
